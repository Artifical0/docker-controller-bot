# Homelab branch: keeps up with upstream releases, tests, and tags what can be deployed.
#
# - push to homelab: test, check the image builds, tag homelab-v<upstream>-h<n>.
# - daily / manual: merge the newest upstream release (vX.Y.Z, no release
#   candidates) into homelab first. A conflict or a failing test opens an issue
#   labelled upstream-sync instead, which the bot reports on Telegram.
#
# The bot polls these tags and builds the image itself on the home Docker host,
# so nothing is pushed to a registry from here.
name: homelab

on:
  push:
    branches: [homelab]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: homelab
  cancel-in-progress: false

jobs:
  homelab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homelab
          fetch-depth: 0

      - name: Merge the newest upstream release
        id: sync
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/dgongut/docker-controller-bot.git
          git fetch --quiet upstream --tags
          latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$latest" HEAD; then
            echo "Already on $latest"; exit 0
          fi
          if git merge --no-edit -m "Merge upstream $latest into homelab" "$latest"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            title="upstream-sync: $latest does not merge cleanly"
            if [ -z "$(gh issue list --label upstream-sync --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
              gh label create upstream-sync --color D93F0B --force >/dev/null
              gh issue create --label upstream-sync --title "$title" \
                --body "Merging upstream \`$latest\` into \`homelab\` conflicts. Resolve by hand: \`git merge $latest\` on homelab."
            fi
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        id: test
        run: |
          pip install --quiet paramiko -r requirements.txt
          python3 tests/run_all.py
          python3 tests/test_homelab.py

      - name: Check the image builds
        run: docker build --quiet -f Dockerfile.homelab --build-arg VERSION=ci -t homelab-ci .

      - name: Report a failed sync
        if: failure() && steps.sync.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="upstream-sync: ${{ steps.sync.outputs.latest }} merges but fails the tests"
          if [ -z "$(gh issue list --label upstream-sync --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            gh label create upstream-sync --color D93F0B --force >/dev/null
            gh issue create --label upstream-sync --title "$title" \
              --body "The merge was not pushed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Push the merge
        if: steps.sync.outputs.merged == 'true'
        # The upstream tag too: later runs number their tags from it.
        run: |
          git push origin "${{ steps.sync.outputs.latest }}"
          git push origin HEAD:homelab

      - name: Tag a deployable version
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD)
          n=$(git rev-list --count "$base"..HEAD)
          tag="homelab-$base-h$n"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag exists"; exit 0
          fi
          git tag "$tag" HEAD
          git push origin "$tag"
          echo "Tagged $tag"
